<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ecedeb" />
    <title>Engagement Ceremony — Abdullah & Hira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="intro" id="intro" aria-hidden="false">
      <div class="envelope-scene">
        <div class="envelope" id="envelope">
          <div class="envelope__back"></div>
          <div class="envelope__flap"></div>
          <div class="envelope__pocket"></div>
          <div class="envelope__card-preview"></div>
        </div>
        <p class="intro__hint" id="introHint">Opening your invitation…</p>
      </div>
    </div>

    <main class="scroll-container" id="mainContent" hidden>
      <section class="panel panel--invite" id="invitePanel">
        <article class="invite-card" role="article" aria-label="Engagement invitation">
          <div class="invite-card__art" aria-hidden="true"></div>
          <div class="invite-card__content">
            <span class="invite-card__mask invite-card__mask--lead" aria-hidden="true"></span>
            <span class="invite-card__mask invite-card__mask--names" aria-hidden="true"></span>
            <span class="invite-card__mask invite-card__mask--meta" aria-hidden="true"></span>

            <p class="invite-card__lead">You are invited at the engagement ceremony of</p>

            <h1 class="invite-card__names">
              <span class="name name--first">Abdullah Qaisar</span>
              <span class="name-divider" aria-hidden="true">&amp;</span>
              <span class="name name--second">Hira Tanveer</span>
            </h1>

            <div class="invite-card__meta" role="group" aria-label="Event details">
              <p class="meta-line meta-line--date">Saturday, 28 November 2026</p>
              <p class="meta-line meta-line--time">7:00 PM</p>
              <p class="meta-line meta-line--venue" id="cardVenue">Lal Din Caterers and Marriage Hall, Raiwand road</p>
            </div>
          </div>
        </article>

        <button type="button" class="scroll-cta" id="scrollToVenue" aria-label="Scroll to venue">
          <span class="scroll-cta__label">Venue &amp; Map</span>
          <span class="scroll-cta__chevron" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 5v12M12 17l5-5M12 17l-5-5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </section>

      <section class="panel panel--venue" id="venuePanel">
        <div class="venue">
          <p class="venue__eyebrow">Location</p>
          <h2 class="venue__name" id="venueName">—</h2>

          <button type="button" class="venue__map-btn" id="openMaps" aria-label="Open location in maps">
            <div class="venue__map-preview" id="mapPreview">
              <iframe
                id="mapEmbed"
                title="Venue location map"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
              <span class="venue__map-overlay">
                <span class="venue__map-cta">Tap to open in Maps</span>
              </span>
            </div>
          </button>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
